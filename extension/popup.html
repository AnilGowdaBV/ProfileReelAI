<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ProfileReel AI</title>
  <style>
    html, body { margin: 0; width: 800px; height: 600px; background: #f4f7fb; font-family: "Segoe UI", sans-serif; color: #0f172a; }
    iframe { width: 800px; height: 600px; border: 0; background: #fff; }
    #gate { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; background: rgba(15, 23, 42, 0.45); }
    form { width: 360px; background: #fff; border-radius: 16px; padding: 28px 24px; box-shadow: 0 16px 40px rgba(15, 23, 42, 0.12); }
    h1 { margin: 0 0 6px; font-size: 22px; }
    p { margin: 0 0 16px; color: #64748b; font-size: 13px; }
    label { display: block; margin: 10px 0 4px; font-size: 12px; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; border: 1px solid #dbe3ee; border-radius: 10px; padding: 10px 12px; font-size: 14px; }
    button { width: 100%; margin-top: 16px; border: 0; border-radius: 10px; padding: 11px; background: #0a66c2; color: #fff; font-weight: 700; cursor: pointer; }
    .link { margin-top: 12px; background: none; color: #0a66c2; font-weight: 600; }
    .error { min-height: 18px; color: #b91c1c; font-size: 12px; margin-top: 8px; }
  </style>
</head>
<body>
  <section id="gate">
    <form id="login-form">
      <h1>Sign in</h1>
      <p>Use your email and either password for this account.</p>
      <label>Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label>Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <div id="error" class="error"></div>
      <button type="submit">Sign in</button>
      <button id="show-create" class="link" type="button">Create account</button>
    </form>
    <form id="create-form" hidden>
      <h1>Create account</h1>
      <p>Your name is taken from the LinkedIn URL. This password joins the same email.</p>
      <label>Email</label>
      <input id="create-email" type="email" autocomplete="username" required>
      <label>LinkedIn URL</label>
      <input id="linkedin" type="url" placeholder="https://www.linkedin.com/in/your-name" required>
      <label>Password</label>
      <input id="create-password" type="password" autocomplete="new-password" required>
      <div id="create-error" class="error"></div>
      <button type="submit">Create account</button>
      <button id="show-login" class="link" type="button">Back to sign in</button>
    </form>
  </section>
  <iframe id="site" src="http://localhost:5174/" title="ProfileReel AI"></iframe>
  <script src="popup.js"></script>
</body>
</html>
